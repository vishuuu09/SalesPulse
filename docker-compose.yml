services:
  db:
    image: postgres:16
    container_name: salespulse-postgres
    environment:
      POSTGRES_DB: salespulse
      POSTGRES_USER: salespulse
      POSTGRES_PASSWORD: salespulse_dev_password
    ports: ["5432:5432"]
    volumes:
      - salespulse_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salespulse -d salespulse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  salespulse_data:
